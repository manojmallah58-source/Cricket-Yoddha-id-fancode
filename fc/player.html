<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Premium Live Stream | FanCode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="https://fancode.com/favicon.ico" type="image/x-icon">
    <!-- Plyr & Tailwind -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #38bdf8; /* Sky Blue */
            --secondary-color: #818cf8; /* Indigo */
            --accent-color: #f472b6; /* Pink */
            --bg-dark: #000000;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: #e2e8f0;
            margin: 0;
            height: 100svh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Dynamic Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.08), transparent 25%);
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Glassmorphism Header */
        .glass-header {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem;
            z-index: 40;
            transition: transform 0.3s ease;
        }

        /* Video Container with Ambient Glow */
        .player-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            box-shadow: 0 0 50px -10px rgba(56, 189, 248, 0.15);
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        
        .plyr--video {
            border-radius: 12px;
        }

        /* Custom Buttons */
        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        /* Telegram Gradient Button */
        .btn-telegram {
            background: linear-gradient(135deg, #229ED9 0%, #1c8ec7 100%);
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(34, 158, 217, 0.4);
        }
        
        .btn-telegram::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        
        .btn-telegram:hover::after {
            left: 100%;
        }
        
        .btn-telegram:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(34, 158, 217, 0.6);
        }

        /* Popup Styling */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
        }
        
        .popup-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .popup-overlay.active .popup-card {
            transform: scale(1) translateY(0);
        }

        /* Loading Spinner */
        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid #FFF;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }
        .loader::after {
            content: '';  
            box-sizing: border-box;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid;
            border-color: #38bdf8 transparent;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Theater Mode Utility */
        body.theater .glass-header, 
        body.theater .player-footer { display: none; }
        body.theater .player-wrapper { max-width: 100%; height: 100vh; border-radius: 0; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .popup-card { padding: 1.5rem; }
            .btn-text-hide { display: none; }
        }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-bg"></div>

    <!-- Header -->
    <header class="glass-header flex items-center justify-between">
        <div class="flex items-center gap-3">
            <a href="fancode.html" class="btn-glass w-10 h-10 flex items-center justify-center text-white/80 hover:text-white">
                <i class="fas fa-chevron-left"></i>
            </a>
            <div>
                <h1 id="match-title" class="text-lg font-bold text-white tracking-wide truncate max-w-[200px] md:max-w-md">Loading Match...</h1>
                <div id="language-badge" class="hidden text-xs font-medium text-sky-300 flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
                    <span id="match-lang-text">English</span>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="btn-theater" class="btn-glass w-10 h-10 text-white/80" title="Theater Mode">
                <i class="fas fa-expand"></i>
            </button>
            <button id="btn-share" class="btn-glass px-4 h-10 flex items-center gap-2 text-sm font-semibold text-amber-400 border-amber-500/30 hover:bg-amber-500/10">
                <i class="fas fa-share-nodes"></i> <span class="btn-text-hide">Share</span>
            </button>
        </div>
    </header>

    <!-- Main Player Area -->
    <main class="flex-grow flex items-center justify-center p-4 relative">
        <div id="loading-state" class="absolute inset-0 flex flex-col items-center justify-center z-10 bg-black/80 backdrop-blur-sm">
            <span class="loader mb-4"></span>
            <p class="text-sky-400 font-medium animate-pulse">Initializing Secure Stream...</p>
        </div>

        <div class="player-wrapper">
            <video id="player" playsinline controls class="w-full h-full"></video>
        </div>
    </main>

    <!-- Footer -->
    <footer class="player-footer p-4 glass-header border-t border-t-white/10">
        <div class="max-w-3xl mx-auto">
            <a href="https://t.me/+rwZKMV0-L8wyOTll" target="_blank" class="btn-telegram w-full py-4 rounded-xl flex items-center justify-center gap-3 text-white font-bold text-lg tracking-wide group">
                <i class="fab fa-telegram-plane text-2xl group-hover:rotate-12 transition-transform"></i>
                <span>Join Official Telegram Channel</span>
            </a>
            <p class="text-center text-xs text-slate-500 mt-3">
                Join for HD Links, Highlights & Live Updates. 100% Free.
            </p>
        </div>
    </footer>

    <!-- Premium Popup -->
    <div id="telegram-popup" class="popup-overlay">
        <div class="popup-card relative overflow-hidden">
            <!-- Decorative Glow -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-500 via-indigo-500 to-sky-500"></div>
            
            <button id="popup-close" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>

            <div class="mb-6 mt-2">
                <div class="w-20 h-20 bg-sky-500/20 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce">
                    <i class="fab fa-telegram text-5xl text-sky-400"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Don't Miss the Action!</h2>
                <p class="text-slate-300 text-sm leading-relaxed">
                    Get instant access to backup links, live scores, and exclusive HD streams.
                </p>
            </div>

            <div class="space-y-3">
                <a href="https://t.me/+rwZKMV0-L8wyOTll" target="_blank" id="popup-join-btn" class="block w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold shadow-lg shadow-sky-500/30 hover:shadow-sky-500/50 transition-all transform hover:scale-[1.02]">
                    <i class="fas fa-paper-plane mr-2"></i> Join Channel Now
                </a>
                <button id="popup-dismiss-btn" class="block w-full py-3 rounded-xl border border-white/10 text-slate-400 text-sm hover:bg-white/5 transition-colors">
                    Continue Watching
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        // --- Configuration ---
        const DATA_URL = 'https://raw.githubusercontent.com/Jitendra-unatti/fancode/refs/heads/main/data/fancode.json';
        const TELEGRAM_LINK = "https://t.me/+rwZKMV0-L8wyOTll";

        // --- UI Elements ---
        const playerElement = document.getElementById('player');
        const loadingState = document.getElementById('loading-state');
        const matchTitleElem = document.getElementById('match-title');
        const langBadge = document.getElementById('language-badge');
        const langText = document.getElementById('match-lang-text');
        
        // --- Helper Functions ---
        const formatLang = (lang) => {
            const map = { 
                'HINDI': 'Hindi', 'ENGLISH': 'English', 'TAMIL': 'Tamil', 
                'TELUGU': 'Telugu', 'KANNADA': 'Kannada', 'BLOODY_SWEET': 'Multi-Audio' 
            };
            return map[lang?.toUpperCase()] || lang || 'Unknown';
        };

        // --- Stream Logic ---
        async function initPlayer() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get("id");
            const cdn = urlParams.get("cdn");

            if (!id || !cdn) {
                showError("Invalid Match Link");
                return;
            }

            try {
                const response = await fetch(DATA_URL);
                const data = await response.json();
                const match = data.matches.find(m => String(m.match_id) === String(id));

                if (!match) throw new Error("Match not found");

                // Update UI
                matchTitleElem.textContent = match.title;
                document.title = match.title + " | Live Stream";
                if(match.language){
                    langText.textContent = formatLang(match.language);
                    langBadge.classList.remove('hidden');
                    langBadge.classList.add('flex');
                }

                // Get URL
                let streamUrl = "";
                if (cdn === "adfree_stream") streamUrl = match.adfree_stream;
                else if (cdn === "dai_stream") streamUrl = match.dai_stream;
                else streamUrl = match.STREAMING_CDN[cdn]; // e.g., akamai, l3

                if (!streamUrl || streamUrl === "Unavailable") throw new Error("Stream Offline");

                loadVideo(streamUrl);

            } catch (error) {
                console.error(error);
                showError("Stream Unavailable or Offline");
            }
        }

        function loadVideo(source) {
            const defaultOptions = {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'],
                autoplay: true,
                tooltips: { controls: true, seek: true }
            };

            if (Hls.isSupported() && source.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(playerElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    const availableQualities = hls.levels.map((l) => l.height);
                    const uniqueQualities = [...new Set(availableQualities)].sort((a, b) => b - a);
                    
                    defaultOptions.quality = {
                        default: uniqueQualities[0],
                        options: uniqueQualities,
                        forced: true,
                        onChange: (e) => hls.currentLevel = hls.levels.findIndex(l => l.height === e)
                    };
                    
                    const player = new Plyr(playerElement, defaultOptions);
                    loadingState.style.display = 'none';
                    player.play().catch(() => player.muted = true); // Autoplay fallback
                });
            } else {
                playerElement.src = source;
                const player = new Plyr(playerElement, defaultOptions);
                loadingState.style.display = 'none';
                player.play();
            }
        }

        function showError(msg) {
            loadingState.innerHTML = `
                <div class="text-center">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-500 mb-3"></i>
                    <h3 class="text-xl font-bold text-white">${msg}</h3>
                    <a href="index.html" class="mt-4 inline-block px-6 py-2 bg-white/10 rounded-lg hover:bg-white/20 transition">Go Back</a>
                </div>
            `;
        }

        // --- Features: Popup, Theater, Share ---
        
        // Popup Logic
        const popup = document.getElementById('telegram-popup');
        const POPUP_KEY = 'fc_premium_popup_seen';

        function showPopup() {
            if(!sessionStorage.getItem(POPUP_KEY)) {
                setTimeout(() => popup.classList.add('active'), 8000); // Show after 8s
            }
        }

        function closePopup(permanent = false) {
            popup.classList.remove('active');
            if(permanent) sessionStorage.setItem(POPUP_KEY, 'true');
        }

        document.getElementById('popup-close').onclick = () => closePopup(true);
        document.getElementById('popup-dismiss-btn').onclick = () => closePopup(true);
        document.getElementById('popup-join-btn').onclick = () => {
            closePopup(true);
            // Link is already in href
        };

        // Theater Mode
        const theaterBtn = document.getElementById('btn-theater');
        theaterBtn.addEventListener('click', () => {
            document.body.classList.toggle('theater');
            const icon = theaterBtn.querySelector('i');
            icon.classList.toggle('fa-expand');
            icon.classList.toggle('fa-compress');
        });

        // Share Function
        document.getElementById('btn-share').addEventListener('click', async () => {
            const shareData = {
                title: document.title,
                text: 'Watch this match live for free!',
                url: window.location.href
            };
            try {
                await navigator.share(shareData);
            } catch {
                navigator.clipboard.writeText(window.location.href);
                const originalText = document.querySelector('.btn-text-hide').textContent;
                document.querySelector('.btn-text-hide').textContent = 'Copied!';
                setTimeout(() => document.querySelector('.btn-text-hide').textContent = originalText, 2000);
            }
        });

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            initPlayer();
            showPopup();
        });
    </script>
</body>
</html>
