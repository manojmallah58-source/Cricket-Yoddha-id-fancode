<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PLAYER - CRICKET YODDHA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    .video-container { width: 100%; height: 100%; position: relative; }
    video { width: 100%; height: 100%; }
    .telegram-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 2rem; border-radius: 20px; z-index: 9999; text-align: center; width: 85%; max-width: 350px; display: none; color: #333; }
    .join-btn { background: #2AABEE; color: white; padding: 10px 20px; border-radius: 10px; display: block; margin-top: 15px; text-decoration: none; font-weight: bold; }
    .close-pop { margin-top: 10px; color: #888; cursor: pointer; display: block; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="video-container" data-shaka-player-container>
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="telegramPopup" class="telegram-popup">
    <h2 style="color:#0088cc"><i class="fab fa-telegram"></i> Join Telegram</h2>
    <p>Live matches aur updates ke liye hamara channel join karein.</p>
    <a href="https://t.me/+rwZKMV0-L8wyOTll" target="_blank" class="join-btn">JOIN CHANNEL</a>
    <span class="close-pop" onclick="closePopup()">Continue Watching</span>
  </div>

  <script>
    async function initPlayer() {
      const urlParams = new URLSearchParams(window.location.search);
      const streamUrl = urlParams.get('url');
      const video = document.getElementById('video');
      const container = document.querySelector('.video-container');

      if (!streamUrl) { alert("No stream URL found!"); return; }

      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);
      
      ui.configure({
        'controlPanelElements': ['play_pause', 'mute', 'volume', 'spacer', 'quality', 'fullscreen']
      });

      try {
        await player.load(streamUrl);
        video.play();
      } catch (e) { console.error("Error loading stream", e); }
    }

    function showPopup() {
      if (localStorage.getItem("tgJoined") !== "true") {
        setTimeout(() => {
          document.getElementById('telegramPopup').style.display = 'block';
          document.getElementById('video').pause();
        }, 6000);
      }
    }

    function closePopup() {
      document.getElementById('telegramPopup').style.display = 'none';
      localStorage.setItem("tgJoined", "true");
      document.getElementById('video').play();
    }

    document.addEventListener('shaka-ui-loaded', initPlayer);
    window.onload = showPopup;
  </script>
</body>
</html>
